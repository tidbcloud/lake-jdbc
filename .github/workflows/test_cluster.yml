name: Cluster Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "nightly"
          - "v1.2.889-nightly"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Start Cluster With Nginx and Minio
        working-directory: tests
        run: make up
        env:
          LAKE_QUERY_VERSION: ${{ matrix.version }}

      - name: Test with conn to nginx
        run: mvn test -DexcludedGroups=FLAKY
        env:
          LAKE_JDBC_TEST_EXTRA_QUERY: presign=off
          LAKE_TEST_CONN_PORT: 8000
          LAKE_QUERY_VERSION: ${{ matrix.version }}
