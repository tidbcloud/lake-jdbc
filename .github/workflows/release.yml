name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Optional version tag or full reviewed commit SHA'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out protected main history
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release source
        id: source
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            ''|main|refs/heads/main) requested="$GITHUB_SHA" ;;
            refs/tags/*) requested="$RELEASE_REF" ;;
            v*) requested="refs/tags/$RELEASE_REF" ;;
            *) requested="$RELEASE_REF" ;;
          esac
          if [[ ! "$requested" =~ ^[0-9a-fA-F]{40}$ && ! "$requested" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Select a version tag or a full commit SHA." >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "$requested^{commit}")
          # 0.4.10 was published from the previous upstream history. Pin its
          # exact existing release commit so a repoint of the tag grants no access.
          if ! git merge-base --is-ancestor "$sha" origin/main &&
             [[ "$sha" != "6a77a359ce94ad4b1dac7deb30ba3f02070af1bf" ]]; then
            echo "Release commit must be reachable from protected main." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$sha"

      - name: Set up JDK for tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test the selected release source without publishing credentials
        run: mvn --batch-mode --no-transfer-progress test -Dgroups=UNIT -DexcludedGroups=FLAKY

  build-and-release:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: maven-central-com-tidbcloud-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-and-test.outputs.source_sha }}
          persist-credentials: false

      - name: Pin Maven for reproducible Central staging
        shell: bash
        run: |
          # New runner Maven versions add repository metadata that the existing Central
          # publisher includes in its bundle. Pin the build tool independently of the source tag.
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/maven.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz
          echo "d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: ${{ vars.MAVEN_CENTRAL_SERVER_ID }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish GPG public key to keyserver
        continue-on-error: true
        run: |
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "No GPG secret key imported; skipping."
            exit 0
          fi
          echo "Publishing public key $KEY_ID"
          for server in keyserver.ubuntu.com keys.openpgp.org; do
            echo "--> $server"
            gpg --keyserver "hkps://$server" --send-keys "$KEY_ID" || echo "send to $server failed (non-fatal)"
          done

      - name: Run Maven clean deploy with release profile
        run: |
          git rev-parse HEAD
          mvn --version
          mvn clean deploy -P release --batch-mode --no-transfer-progress \
            -DignorePublishedComponents=true -DwaitUntil=PUBLISHED
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
